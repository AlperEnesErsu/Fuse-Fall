# Runs what `npm run check` and `npm run build` run locally, on every push to
# main and every pull request, so a broken type, lint rule, test or build is
# seen before merging rather than after.
name: check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Types, lint and tests
        run: npm run check
      - name: Coverage threshold (NFR-09)
        run: npm run coverage
      - name: Web build
        run: npm run build

  # The level JSON is generated: a hand edit, or a generator change without a rebuild, shows up here.
  levels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Levels match their generator
        run: |
          python tools/genlevels.py src/content/levels
          git diff --exit-code -- src/content/levels

  # Every level stays forgiving enough: near misses of its solution still clear it often enough for its difficulty.
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Level balance thresholds
        run: npm run balance

  # The game played with touch in the two mobile engines: Chromium (Android) and WebKit (iOS).
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Mobile play-through (Chromium and WebKit)
        run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
