apply plugin: 'com.android.application'

// Release signing comes from android/keystore.properties (git-ignored), which the
// release owner creates next to their own keystore. Without it, release builds are unsigned.
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// The app version comes from package.json: "1.4.2" is versionName 1.4.2 and
// versionCode 10402, so every store upload only needs `npm version patch|minor`.
def appVersion = new groovy.json.JsonSlurper().parse(rootProject.file('../package.json')).version
def versionParts = appVersion.tokenize('.')
if (versionParts.size() != 3 || !versionParts.every { it.isInteger() }) {
    throw new GradleException("package.json version must be MAJOR.MINOR.PATCH, got ${appVersion}")
}
def (versionMajor, versionMinor, versionPatch) = versionParts.collect { it.toInteger() }
if (versionMinor > 99 || versionPatch > 99) throw new GradleException("Minor and patch go up to 99 (versionCode ${appVersion})")

android {
    namespace = "com.fuseandfall.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.fuseandfall.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName appVersion
        manifestPlaceholders = [admobAppId: project.findProperty('admobAppId')]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            if (keystorePropertiesFile.exists()) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// A store build must carry the web build made for the store (npm run build:release):
// never the test build, which opens every city and shows Google's test ads.
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        def info = file('src/main/assets/public/build-info.json')
        if (!info.exists()) throw new GradleException('No web build in the app. Run: npm run build:release && npx cap sync android')
        def build = new groovy.json.JsonSlurper().parse(info)
        if (build.mode != 'release' || build.unlockAll) {
            throw new GradleException("The app holds a '${build.mode}' web build. For the store run: npm run build:release && npx cap sync android")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
