<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Adaptive-icon foreground: everything important stays inside the central 66% safe zone. -->
  <defs>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.35" stop-color="#ffc35a"/>
      <stop offset="0.7" stop-color="#f2862c" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#f2862c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hazard" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="24" height="48" fill="#f2b134"/>
      <rect x="24" width="24" height="48" fill="#16181c"/>
    </pattern>
  </defs>
  <g transform="translate(512 512) scale(1.15) translate(-511 -492)">
  <!-- Ground with hazard tape -->
  <rect x="232" y="700" width="560" height="26" fill="url(#hazard)"/>
  <!-- Chimney segments, toppling to the right from a cut at its base -->
  <g transform="rotate(16 440 700)">
    <rect x="404" y="610" width="72" height="90" fill="#8f9399" stroke="#1c1f24" stroke-width="6"/>
    <rect x="404" y="514" width="72" height="90" fill="#8f9399" stroke="#1c1f24" stroke-width="6"/>
    <rect x="404" y="418" width="72" height="90" fill="#8f9399" stroke="#1c1f24" stroke-width="6"/>
    <rect x="404" y="322" width="72" height="90" fill="#8f9399" stroke="#1c1f24" stroke-width="6"/>
    <!-- Target block with the surveyor mark -->
    <rect x="411" y="258" width="58" height="58" fill="#b9844f" stroke="#1c1f24" stroke-width="6"/>
    <circle cx="440" cy="287" r="17" fill="none" stroke="#e5484d" stroke-width="6"/>
    <path d="M440 260v12M440 302v12M413 287h12M455 287h12" stroke="#e5484d" stroke-width="6"/>
  </g>
  <!-- Blast at the base -->
  <circle cx="404" cy="676" r="150" fill="url(#blast)"/>
  <circle cx="404" cy="676" r="44" fill="#fffaf0"/>
  <!-- Flying debris -->
  <rect x="300" y="560" width="26" height="18" fill="#6e7278" transform="rotate(-25 313 569)"/>
  <rect x="560" y="600" width="20" height="14" fill="#6e7278" transform="rotate(30 570 607)"/>
  <rect x="330" y="470" width="16" height="12" fill="#a7abb1" transform="rotate(15 338 476)"/>
  </g>
</svg>
