# Netlify: the web game. Every pull request gets its own deploy preview; what reaches
# the public site is decided in the Netlify UI (docs/web.md): publishing stays locked,
# and a deploy goes live only when someone presses "Publish deploy".

[build]
  command = "npm run build"
  publish = "dist"

# Node comes from .nvmrc. Python and the Android SDK are not needed for the web build.

# The service worker and the page must never be served stale: they decide which
# release a player gets. Everything under assets/ has a content hash in its name.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
